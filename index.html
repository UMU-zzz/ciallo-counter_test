
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciallo Counter ✦</title>

<style>
:root {
  --pink: #ed6ca3;
  --ink: #594258;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  font-family: "Noto Sans TC", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 12% 12%, #ffe0ed, transparent 36%),
    radial-gradient(ellipse at 87% 18%, #e8ddff, transparent 34%),
    linear-gradient(145deg, #fffaf4, #fff0f7 60%, #f2edff);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .22;
  background-image: radial-gradient(#d58fb4 .8px, transparent .8px);
  background-size: 19px 19px;
}

/* 左上角標題 */
.top {
  position: fixed;
  z-index: 20;
  top: 18px;
  left: 20px;
}

.brand {
  font-size: 18px;
  font-weight: 950;
}

.brand b {
  color: var(--pink);
}

/* 中央主畫面 */
.center {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(900px, 94vw);
  text-align: center;
  pointer-events: none;
}

.eyebrow {
  display: inline-block;
  padding: 7px 13px;
  border: 1px solid white;
  border-radius: 99px;
  background: #fff9;
  color: #b35b86;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .1em;
}

h1 {
  font-size: clamp(45px, 9vw, 92px);
  line-height: 1.02;
  letter-spacing: -.06em;
  margin: 20px 0 10px;
  text-shadow: 0 4px white, 0 8px 24px #e8a3c53b;
}

h1 em {
  font-style: normal;
  color: var(--pink);
}

.sub {
  font-size: clamp(13px, 2vw, 17px);
  line-height: 1.8;
  color: #98778e;
  margin: 0 0 24px;
}

/* 計數器 */
.counter {
  display: inline-flex;
  align-items: center;
  gap: 17px;
  justify-content: center;
  min-width: 205px;
  padding: 14px 22px;
  background: #fffdf7dc;
  border: 1px solid white;
  border-radius: 25px;
  box-shadow: 0 14px 44px #c879a51c;
}

.num {
  font-size: clamp(38px, 6vw, 54px);
  font-weight: 1000;
  line-height: 1;
  color: var(--pink);
  font-variant-numeric: tabular-nums;
}

.label {
  font-size: 10px;
  letter-spacing: .16em;
  color: #a8879b;
  font-weight: 900;
  margin-top: 4px;
}

/* 裝飾 */
.spark {
  position: fixed;
  z-index: 1;
  pointer-events: none;
  font-size: clamp(22px, 4vw, 40px);
  color: #f5a4c7;
  animation: floaty 5s ease-in-out infinite;
}

.s1 {
  left: 12%;
  top: 28%;
}

.s2 {
  right: 14%;
  top: 30%;
  color: #bba7f5;
  animation-delay: -1.7s;
}

.s3 {
  left: 18%;
  bottom: 18%;
  color: #a7dfd1;
  animation-delay: -2.8s;
}

.s4 {
  right: 18%;
  bottom: 19%;
  animation-delay: -.7s;
}

/* 點擊後飄過的角色 */
.fly {
  position: fixed;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 11px;
  white-space: nowrap;
  pointer-events: none;
  animation: fly 5s linear forwards;
}

.avatar {
  width: 76px;
  height: 76px;
  border-radius: 23px;
  border: 3px solid white;
  box-shadow: 0 7px 20px #8f648b30;
  overflow: hidden;
  display: grid;
  place-items: center;
  flex: none;
  background: var(--bg, #f8c9de);
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.initial {
  font-size: 26px;
  font-weight: 1000;
  color: white;
}

.bubble {
  padding: 10px 15px;
  border: 2px solid white;
  border-radius: 18px;
  background: #fffdf8;
  color: #e35e99;
  font-size: clamp(15px, 2.4vw, 23px);
  font-weight: 1000;
  box-shadow: 0 7px 20px #a46c9020;
}

.bubble small {
  display: block;
  margin-bottom: 2px;
  font-size: 10px;
  color: #a8879b;
}

@keyframes fly {
  0% {
    transform: translateX(110vw);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  85% {
    opacity: 1;
  }

  100% {
    transform: translateX(-120%);
    opacity: 0;
  }
}

@keyframes floaty {
  0%, 100% {
    transform: translateY(0) rotate(-5deg);
  }

  50% {
    transform: translateY(-16px) rotate(7deg);
  }
}

@media (max-width: 600px) {
  .top {
    top: 13px;
    left: 13px;
  }

  .brand {
    font-size: 16px;
  }

  .avatar {
    width: 60px;
    height: 60px;
  }

  .fly {
    gap: 8px;
  }

  .bubble {
    padding: 8px 11px;
  }
}
</style>
</head>

<body>

<!-- 左上角只保留 Ciallo Counter -->
<header class="top">
  <div class="brand"><b>Ciallo</b> Counter</div>
</header>

<!-- 背景裝飾 -->
<span class="spark s1">✦</span>
<span class="spark s2">✧</span>
<span class="spark s3">♡</span>
<span class="spark s4">✦</span>

<!-- 中央主畫面 -->
<main class="center">
  <div class="eyebrow">
    CAFÉ STELLA & REAPER'S BUTTERFLIES
  </div>

  <h1>
    <em>Ciallo</em>!<br>
    <span style="font-size:.58em;letter-spacing:-.035em">
      (∠・ω&lt; )⌒☆
    </span>
  </h1>

  <p class="sub">
    讓可愛的 Ciallo 飄滿整個畫面。
  </p>

  <div class="counter">
    <div>
      <div class="num" id="count">0</div>
      <div class="label">CIALLO COUNT</div>
    </div>
    <div style="font-size:29px">🎀</div>
  </div>
</main>

<script>
const characters = [
  {
    id: "natsume",
    name: "四季ナツメ",
    initial: "夏",
    color: "#e9a4c2"
  },
  {
    id: "kanna",
    name: "明月栞那",
    initial: "栞",
    color: "#b6a6ed"
  },
  {
    id: "nozomi",
    name: "墨染希",
    initial: "希",
    color: "#8fcfc5"
  },
  {
    id: "ai",
    name: "火打谷愛衣",
    initial: "愛",
    color: "#f1c17f"
  },
  {
    id: "suzune",
    name: "汐山涼音",
    initial: "涼",
    color: "#f19ca8"
  }
];

let count = 0;
let previousIndex = -1;

const countEl = document.getElementById("count");

function chooseCharacter() {
  let index;

  do {
    index = Math.floor(Math.random() * characters.length);
  } while (
    characters.length > 1 &&
    index === previousIndex
  );

  previousIndex = index;
  return characters[index];
}

/* 沒有角色語音時播放備用提示音 */
function playFallbackChime() {
  try {
    const AudioContext =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContext) return;

    const ctx = new AudioContext();
    const start = ctx.currentTime;

    [659.25, 783.99, 987.77].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t = start + i * 0.095;

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(
        0.10, t + 0.025
      );
      gain.gain.exponentialRampToValueAtTime(
        0.0001, t + 0.18
      );

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(t);
      osc.stop(t + 0.2);
    });

    setTimeout(() => ctx.close(), 700);
  } catch (error) {
    console.info("無法播放提示音", error);
  }
}

/* 顯示角色圖片及 Ciallo 漂浮動畫 */
function spawnCiallo(x, y, character) {
  const item = document.createElement("div");
  item.className = "fly";

  item.style.top = Math.max(
    85,
    Math.min(
      window.innerHeight - 115,
      y - 36 + Math.random() * 40 - 20
    )
  ) + "px";

  item.style.left = Math.max(
    0,
    Math.min(window.innerWidth * 0.25, x - 40)
  ) + "px";

  item.style.setProperty("--bg", character.color);

  const avatar = document.createElement("div");
  avatar.className = "avatar";

  const img = document.createElement("img");
  img.src = `assets/characters/${character.id}.png`;
  img.alt = character.name;

  img.onerror = () => {
    img.remove();

    const initial = document.createElement("span");
    initial.className = "initial";
    initial.textContent = character.initial;

    avatar.appendChild(initial);
  };

  avatar.appendChild(img);

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const name = document.createElement("small");
  name.textContent = character.name;

  const text = document.createElement("span");
  text.textContent = "Ciallo (∠・ω< )⌒☆";

  bubble.append(name, text);
  item.append(avatar, bubble);
  document.body.appendChild(item);

  item.addEventListener(
    "animationend",
    () => item.remove(),
    { once: true }
  );

  /* 播放對應角色音檔 */
  const audio = new Audio(
    `assets/audio/${character.id}.mp3`
  );

  audio.volume = 0.9;

  let fallbackPlayed = false;

  function fallbackOnce() {
    if (fallbackPlayed) return;
    fallbackPlayed = true;
    playFallbackChime();
  }

  audio.addEventListener("error", fallbackOnce, {
    once: true
  });

  audio.play().catch(fallbackOnce);
}

/* 點擊畫面任何位置 */
document.addEventListener("pointerdown", (event) => {
  count += 1;

  countEl.textContent =
    count.toLocaleString("en-US");

  spawnCiallo(
    event.clientX,
    event.clientY,
    chooseCharacter()
  );
});
</script>

</body>
</html>
